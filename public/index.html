<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React simplu – AI Code Review & Auto-fix</title>
    <style>
      :root {
        --muted: #f5f5f5;
        --border: #e5e7eb;
        --text: #111827;
        --low: #3b82f6;
        --med: #f59e0b;
        --high: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 24px;
        color: var(--text);
      }
      .btn {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        background: #fff;
      }
      input,
      select {
        padding: 8px;
        margin-right: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      textarea {
        width: 100%;
        height: 260px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--muted);
      }
      pre {
        background: var(--muted);
        padding: 10px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid var(--border);
      }
      hr {
        margin: 24px 0;
        border: 0;
        height: 1px;
        background: var(--border);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: #fff;
        border: 1px solid var(--border);
        margin-right: 6px;
      }
      .sev {
        font-weight: 600;
      }
      .sev-low {
        color: var(--low);
      }
      .sev-medium {
        color: var(--med);
      }
      .sev-high {
        color: var(--high);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      @media (min-width: 860px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>React simplu</h1>
    <div id="root"></div>

    <!-- React + ReactDOM -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel pentru JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, Fragment } = React;

      function Severity({ level }) {
        const cls =
          level === "high"
            ? "sev-high"
            : level === "medium"
            ? "sev-medium"
            : "sev-low";
        return (
          <span className={`sev ${cls}`}>
            {(level || "info").toUpperCase()}
          </span>
        );
      }

      function Findings({ list }) {
        if (!Array.isArray(list) || list.length === 0) {
          return (
            <div className="card">
              Nu s-au găsit probleme pe analiza curentă.
            </div>
          );
        }
        return (
          <div className="grid">
            {list.map((f, i) => (
              <div className="card" key={i}>
                <div style={{ marginBottom: 6 }}>
                  <span className="tag">[{f.type || "info"}]</span>
                  <Severity level={f.severity} />
                </div>
                <strong>{f.title}</strong>
                <div style={{ opacity: 0.85, marginTop: 4 }}>{f.detail}</div>
                {Array.isArray(f.lines) && f.lines.length > 0 && (
                  <div style={{ marginTop: 6, fontSize: 12, opacity: 0.8 }}>
                    Linii: {f.lines.slice(0, 15).join(", ")}
                    {f.lines.length > 15 ? " ..." : ""}
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      }

      function Suggestions({ items }) {
        if (!Array.isArray(items) || items.length === 0) return null;
        return (
          <ul>
            {items.map((s, i) => (
              <li key={i}>{s}</li>
            ))}
          </ul>
        );
      }

      function App() {
        const [name, setName] = useState("");
        const [ping, setPing] = useState(null);

        const [filename, setFilename] = useState("snippet.js");
        const [code, setCode] = useState(`// pune codul aici
function hello(name){
  console.log("Hello, " + name) // TODO: folosește template string
}
`);
        const [useLlm, setUseLlm] = useState(true);
        const [model, setModel] = useState("llama3");

        const [report, setReport] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [beforeFix, setBeforeFix] = useState(null); // pentru „Revenire”

        async function callPing() {
          const res = await fetch("/api/ping");
          setPing(await res.json());
        }

        async function submitReview() {
          setLoading(true);
          setError("");
          setReport(null);
          try {
            const res = await fetch("/api/review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, filename, useLlm, model }),
            });
            setReport(await res.json());
          } catch {
            setError("Eroare la apelul API");
          } finally {
            setLoading(false);
          }
        }

        async function autoFixAI() {
          setLoading(true);
          setError("");
          try {
            setBeforeFix(code); // salvează starea anterioară pentru revenire
            const res = await fetch("/api/auto-fix", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, filename, model }),
            });
            const data = await res.json();
            if (data?.fixed_code) {
              setCode(data.fixed_code);
              setReport({
                engine: data.engine,
                filename: data.filename,
                structured: { findings: [], suggestions: [] },
                raw: data.raw,
                changes: data.changes,
              });
            } else {
              setError("Auto-fix: răspuns invalid");
            }
          } catch {
            setError("Eroare la auto-fix");
          } finally {
            setLoading(false);
          }
        }

        function undoFix() {
          if (beforeFix != null) {
            setCode(beforeFix);
            setBeforeFix(null);
          }
        }

        function downloadJson() {
          const payload = report?.structured || report || {};
          const blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = (report?.filename || "report") + ".json";
          a.click();
          URL.revokeObjectURL(url);
        }

        useEffect(() => {
          callPing();
        }, []);

        const engine = report?.engine || "n/a";
        const structured = report?.structured;
        const findings = structured?.findings || report?.findings || [];
        const suggestions =
          structured?.suggestions || report?.suggestions || [];

        return (
          <Fragment>
            <p>Salut, {name || "vizitator"}!</p>
            <input
              placeholder="scrie un nume..."
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
            <button className="btn" onClick={callPing}>
              Ping backend
            </button>
            <pre>{ping ? JSON.stringify(ping, null, 2) : "..."}</pre>

            <hr />

            <h3>Code review local</h3>
            <div className="toolbar" style={{ marginBottom: 8 }}>
              <input
                placeholder="filename"
                value={filename}
                onChange={(e) => setFilename(e.target.value)}
              />
              <label style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input
                  type="checkbox"
                  checked={useLlm}
                  onChange={(e) => setUseLlm(e.target.checked)}
                />
                Use LLM
              </label>
              <select value={model} onChange={(e) => setModel(e.target.value)}>
                <option value="llama3">llama3</option>
                <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
              </select>
              <button className="btn" onClick={submitReview} disabled={loading}>
                {loading ? "Analizez..." : "Trimite spre analiză"}
              </button>
              <button className="btn" onClick={autoFixAI} disabled={loading}>
                Auto-fix (AI)
              </button>
              {beforeFix != null && (
                <button className="btn" onClick={undoFix}>
                  Revenire
                </button>
              )}
              {report && (
                <button className="btn" onClick={downloadJson}>
                  Descarcă JSON
                </button>
              )}
              <span className="tag">engine: {engine}</span>
              <span className="tag">file: {report?.filename || filename}</span>
            </div>

            <textarea
              value={code}
              onChange={(e) => setCode(e.target.value)}
              spellCheck={false}
            />

            {error && (
              <div style={{ color: "crimson", marginTop: 8 }}>{error}</div>
            )}

            {report && (
              <div style={{ marginTop: 12 }}>
                {engine === "ollama-llm" && !structured && (
                  <div className="card" style={{ marginBottom: 12 }}>
                    <strong>LLM Feedback (raw)</strong>
                    <pre>{report.raw || ""}</pre>
                  </div>
                )}

                {Array.isArray(report?.changes) &&
                  report.changes.length > 0 && (
                    <div className="card" style={{ marginBottom: 12 }}>
                      <strong>Auto-fix changes</strong>
                      <ul>
                        {report.changes.map((c, i) => (
                          <li key={i}>
                            <strong>{c.title}</strong> — {c.detail}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                <h4>Findings</h4>
                <Findings list={findings} />

                <h4 style={{ marginTop: 16 }}>Sugestii</h4>
                <Suggestions items={suggestions} />
              </div>
            )}
          </Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
