<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Code Review</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --soft: #111a2e;
        --muted: #0e1629;
        --ink: #e5e7eb;
        --ink-dim: #cbd5e1;
        --brand: #60a5fa;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --brd: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(
            1200px 800px at 10% -10%,
            #0b1d42 0%,
            var(--bg) 60%
          )
          fixed;
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          sans-serif;
      }
      .container {
        max-width: 1100px;
        margin: 32px auto;
        padding: 0 20px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      .title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .subtle {
        color: var(--ink-dim);
        font-size: 13px;
      }
      .panel {
        background: linear-gradient(180deg, var(--panel) 0%, var(--soft) 100%);
        border: 1px solid var(--brd);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--brd);
        margin-bottom: 12px;
      }
      .btn {
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid var(--brd);
        background: #101a33;
        color: var(--ink);
        transition: 0.15s ease;
        font-weight: 600;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      }
      .btn.primary {
        background: linear-gradient(180deg, #2563eb, #1d4ed8);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .btn.ghost {
        background: transparent;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--brd);
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.03);
      }
      input[type="text"],
      select {
        height: 38px;
        padding: 0 10px;
        border-radius: 10px;
        border: 1px solid var(--brd);
        background: #0e1629;
        color: var(--ink);
        outline: none;
      }
      input[type="file"] {
        display: none;
      }
      label.file {
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px dashed var(--brd);
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        transition: 0.15s ease;
        font-weight: 600;
      }
      label.file:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      textarea {
        width: 100%;
        min-height: 280px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        background: #091226;
        color: #e2e8f0;
        border: 1px solid var(--brd);
        border-radius: 12px;
        padding: 12px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--brd);
        border-radius: 12px;
        padding: 12px;
      }
      pre {
        margin: 8px 0 0;
        background: #0a1330;
        border: 1px solid var(--brd);
        border-radius: 10px;
        padding: 10px;
        color: #dbeafe;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .sev {
        font-weight: 700;
      }
      .sev-low {
        color: #60a5fa;
      }
      .sev-medium {
        color: #f59e0b;
      }
      .sev-high {
        color: #ef4444;
      }
      .error {
        color: var(--err);
        margin-top: 8px;
      }
      .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      details {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--brd);
        padding: 8px 10px;
        border-radius: 8px;
      }
      details > summary {
        cursor: pointer;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">AI Code Review</div>
        <div class="subtle">Local · React + Express · Ollama</div>
      </div>
      <div class="panel" id="root"></div>
    </div>

    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, Fragment } = React;

      function Severity({ level }) {
        const cls =
          level === "high"
            ? "sev-high"
            : level === "medium"
            ? "sev-medium"
            : "sev-low";
        return (
          <span className={`sev ${cls}`}>
            {(level || "info").toUpperCase()}
          </span>
        );
      }

      function Findings({ list }) {
        if (!Array.isArray(list) || list.length === 0) {
          return (
            <div className="card">
              Nu s-au găsit probleme pe analiza curentă.
            </div>
          );
        }
        return (
          <div className="grid">
            {list.map((f, i) => (
              <div className="card" key={i}>
                <div
                  style={{
                    display: "flex",
                    gap: 8,
                    alignItems: "center",
                    marginBottom: 6,
                  }}
                >
                  <span className="tag">[{f.type || "info"}]</span>
                  <Severity level={f.severity} />
                  {f.effort && (
                    <span className="tag">
                      Effort: {f.effort.bucket} · {f.effort.hours}h
                    </span>
                  )}
                </div>
                <strong>{f.title}</strong>
                <div style={{ opacity: 0.85, marginTop: 4 }}>{f.detail}</div>

                {Array.isArray(f.lines) && f.lines.length > 0 && (
                  <div style={{ marginTop: 6, fontSize: 12, opacity: 0.8 }}>
                    Linii: {f.lines.slice(0, 15).join(", ")}
                    {f.lines.length > 15 ? " ..." : ""}
                  </div>
                )}

                {Array.isArray(f.code_excerpt) && f.code_excerpt.length > 0 && (
                  <div style={{ marginTop: 6 }}>
                    <div className="subtle" style={{ fontSize: 12 }}>
                      Fragment(e) de cod:
                    </div>
                    <pre>
                      {f.code_excerpt.slice(0, 5).join("\n")}
                      {f.code_excerpt.length > 5 ? "\n..." : ""}
                    </pre>
                  </div>
                )}

                {f.docs && (
                  <details style={{ marginTop: 6 }}>
                    <summary>Documentație</summary>
                    <div className="subtle" style={{ fontSize: 12, marginTop: 6 }}>
                      De ce contează
                    </div>
                    <div>{f.docs.why_it_matters || "Unknown"}</div>

                    <div className="subtle" style={{ fontSize: 12, marginTop: 6 }}>
                      Cum se rezolvă
                    </div>
                    <ul>
                      {(f.docs.how_to_fix || []).map((s, i) => (
                        <li key={i}>{s}</li>
                      ))}
                    </ul>

                    {f.docs.bad_example && (
                      <>
                        <div className="subtle" style={{ fontSize: 12 }}>
                          Exemplu greșit
                        </div>
                        <pre>{f.docs.bad_example}</pre>
                      </>
                    )}

                    {f.docs.good_example && (
                      <>
                        <div className="subtle" style={{ fontSize: 12 }}>
                          Exemplu corect
                        </div>
                        <pre>{f.docs.good_example}</pre>
                      </>
                    )}
                  </details>
                )}
              </div>
            ))}
          </div>
        );
      }

      function Suggestions({ items }) {
        if (!Array.isArray(items) || items.length === 0) return null;
        return (
          <ul>
            {items.map((s, i) => (
              <li key={i}>{s}</li>
            ))}
          </ul>
        );
      }

      function looksPlausibleSource(text) {
        if (!text || typeof text !== "string") return false;
        if (text.trim().length < 25) return false;
        if (/^[\w\-. ]+\.(js|ts|jsx|tsx)$/i.test(text.trim())) return false;
        if (!/[{}();=]/.test(text) && !/\b(function|const|let|var)\b/.test(text)) return false;
        return true;
      }

      function App() {
        const [filename, setFilename] = useState("snippet.js");
        const [code, setCode] = useState(`// pune codul aici
function hello(name){
  // TODO: folosește template string
  console.log("Hello, " + name)
}
`);
        const [useLlm, setUseLlm] = useState(true);
        const [model, setModel] = useState("llama3");

        const [report, setReport] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");
        const [beforeFix, setBeforeFix] = useState(null);

        function handleFile(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            setFilename(file.name);
            setCode(String(reader.result || ""));
          };
          reader.readAsText(file);
        }

        async function submitReview() {
          setLoading(true);
          setError("");
          setReport(null);
          try {
            const res = await fetch("/api/review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, filename, useLlm, model }),
            });
            setReport(await res.json());
          } catch {
            setError("Eroare la apelul API");
          } finally {
            setLoading(false);
          }
        }

        async function autoFixAI() {
          setLoading(true);
          setError("");
          try {
            setBeforeFix(code);
            const res = await fetch("/api/auto-fix", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, filename, model }),
            });
            const data = await res.json();
            setReport({
              engine: data.engine,
              filename: data.filename,
              structured: { findings: [], suggestions: [] },
              raw: data.raw,
              changes: data.changes || [],
              suggestions: [],
              findings: data.findings || [],
            });

            const bad =
              !data.fixed_code ||
              data.fixed_code.trim() === filename.trim() ||
              data.fixed_code.trim().length < 25 ||
              !looksPlausibleSource(data.fixed_code);

            if (!bad && (data.engine === "ollama-fix" || data.engine === "auto-fix-fallback-local")) {
              setCode(data.fixed_code);
            } else if (data.engine === "auto-fix-invalid" || data.engine === "auto-fix-fallback") {
              const reason =
                Array.isArray(data.changes) && data.changes[0]?.detail
                  ? `Motiv: ${data.changes[0].detail}`
                  : "Output nevalid de la model.";
              setError(`Auto-fix nu a fost aplicat. ${reason}`);
            }
          } catch {
            setError("Eroare la auto-fix");
          } finally {
            setLoading(false);
          }
        }

        function undoFix() {
          if (beforeFix != null) {
            setCode(beforeFix);
            setBeforeFix(null);
          }
        }
        function downloadJson() {
          const payload = report?.structured || report || {};
          const blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = (report?.filename || "report") + ".json";
          a.click();
          URL.revokeObjectURL(url);
        }

        useEffect(() => {
          document.getElementById("code-area")?.focus();
        }, []);

        const engine = report?.engine || "n/a";
        const findings = report?.findings || report?.structured?.findings || [];
        const suggestions =
          report?.suggestions || report?.structured?.suggestions || [];
        const effortTotal = report?.effort_total;

        return (
          <Fragment>
            <div className="toolbar">
              <input
                type="text"
                placeholder="ex: snippet.js"
                value={filename}
                onChange={(e) => setFilename(e.target.value)}
              />
              <label className="file">
                Încarcă fișier
                <input
                  type="file"
                  accept=".js,.jsx,.ts,.tsx,.json,.py,.java,.go,.rb,.cs,.cpp,.c,.txt"
                  onChange={handleFile}
                />
              </label>
              <label className="tag" style={{ gap: 8 }}>
                <input
                  type="checkbox"
                  checked={useLlm}
                  onChange={(e) => setUseLlm(e.target.checked)}
                />{" "}
                Use LLM
              </label>
              <select value={model} onChange={(e) => setModel(e.target.value)}>
                <option value="llama3">llama3</option>
                <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
              </select>
              <button
                className="btn primary"
                onClick={submitReview}
                disabled={loading}
              >
                {loading ? "Analizez..." : "Trimite spre analiză"}
              </button>
              <button className="btn" onClick={autoFixAI} disabled={loading}>
                Auto-fix (AI)
              </button>
              {beforeFix != null && (
                <button className="btn ghost" onClick={undoFix}>
                  Revenire
                </button>
              )}
              {report && (
                <button className="btn ghost" onClick={downloadJson}>
                  Descarcă JSON
                </button>
              )}
              <div className="meta" style={{ marginLeft: "auto" }}>
                <span className="tag">engine: {engine}</span>
                <span className="tag">
                  file: {report?.filename || filename}
                </span>
                {effortTotal && (
                  <span className="tag">
                    Effort total: {effortTotal.bucket} · {effortTotal.hours}h
                  </span>
                )}
              </div>
            </div>

            <textarea
              id="code-area"
              value={code}
              onChange={(e) => setCode(e.target.value)}
              spellCheck={false}
              placeholder="// pune codul aici..."
            />

            {error && <div className="error">{error}</div>}

            {report && (
              <div style={{ marginTop: 14 }}>
                {Array.isArray(report?.changes) &&
                  report.changes.length > 0 && (
                    <div className="card" style={{ marginBottom: 12 }}>
                      <strong>Auto-fix changes</strong>
                      <ul>
                        {report.changes.map((c, i) => (
                          <li key={i}>
                            <strong>{c.title}</strong> — {c.detail}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                {report?.raw && (
                  <details style={{ marginBottom: 12 }} open={false}>
                    <summary>Vezi răspuns LLM brut</summary>
                    <pre>
                      {typeof report.raw === "string"
                        ? report.raw
                        : JSON.stringify(report.raw, null, 2)}
                    </pre>
                  </details>
                )}

                <h3 style={{ margin: "10px 0" }}>Findings</h3>
                <Findings list={findings} />

                <h3 style={{ margin: "16px 0 8px" }}>Sugestii</h3>
                <Suggestions items={suggestions} />
              </div>
            )}
          </Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
