<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React simplu</title>

    <style>
      :root {
        --bg: #ffffff;
        --muted: #f5f5f5;
        --border: #e5e7eb;
        --text: #111827;
        --ok: #10b981;
        --low: #3b82f6;
        --med: #f59e0b;
        --high: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 24px;
        color: var(--text);
        background: var(--bg);
      }
      .btn {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        background: #fff;
      }
      input {
        padding: 8px;
        margin-right: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      textarea {
        width: 100%;
        height: 220px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--muted);
      }
      pre {
        background: var(--muted);
        padding: 10px;
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        border: 1px solid var(--border);
      }
      hr {
        margin: 24px 0;
        border: 0;
        height: 1px;
        background: var(--border);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: #fff;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--muted);
        border: 1px solid var(--border);
      }
      .sev {
        font-weight: 600;
      }
      .sev-low {
        color: var(--low);
      }
      .sev-medium {
        color: var(--med);
      }
      .sev-high {
        color: var(--high);
      }
      .empty {
        opacity: 0.7;
        font-style: italic;
      }
      .title {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .subtle {
        opacity: 0.8;
      }
      @media (min-width: 860px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>React simplu</h1>
    <div id="root"></div>

    <!-- React + ReactDOM -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <!-- Babel pentru JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Cod React cu JSX -->
    <script type="text/babel">
      const { useState, useEffect, Fragment } = React;

      function SeverityTag({ level }) {
        const map = { low: "sev-low", medium: "sev-medium", high: "sev-high" };
        return (
          <span className={`sev ${map[level] || ""}`}>
            {level?.toUpperCase?.() || "INFO"}
          </span>
        );
      }

      function Findings({ list }) {
        if (!Array.isArray(list) || list.length === 0) {
          return (
            <div className="empty">
              Nu s-au găsit probleme pe regulile de bază.
            </div>
          );
        }
        return (
          <div className="grid">
            {list.map((f, i) => (
              <div className="card" key={i}>
                <h4 className="title">
                  [{f.type}] <SeverityTag level={f.severity} /> — {f.title}
                </h4>
                <div className="subtle">{f.detail}</div>
              </div>
            ))}
          </div>
        );
      }

      function Suggestions({ items }) {
        if (!Array.isArray(items) || items.length === 0) return null;
        return (
          <ul>
            {items.map((s, i) => (
              <li key={i}>{s}</li>
            ))}
          </ul>
        );
      }

      function App() {
        const [name, setName] = useState("");
        const [ping, setPing] = useState(null);

        const [filename, setFilename] = useState("snippet.js");
        const [code, setCode] = useState(`// pune codul aici
function hello(name){
  console.log("Hello, " + name) // TODO: folosește template string
}
`);
        const [report, setReport] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        async function callPing() {
          const res = await fetch("/api/ping");
          setPing(await res.json());
        }

        async function submitReview() {
          setLoading(true);
          setError("");
          setReport(null);
          try {
            const res = await fetch("/api/review", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code, filename }),
            });
            const data = await res.json();
            setReport(data);
          } catch (e) {
            setError("Eroare la apelul API");
          } finally {
            setLoading(false);
          }
        }

        useEffect(() => {
          callPing();
        }, []);

        return (
          <Fragment>
            <p>Salut, {name || "vizitator"}!</p>
            <input
              placeholder="scrie un nume..."
              value={name}
              onChange={(e) => setName(e.target.value)}
            />
            <button className="btn" onClick={callPing}>
              Ping backend
            </button>
            <pre>{ping ? JSON.stringify(ping, null, 2) : "..."}</pre>

            <hr />

            <h3>Code review local</h3>
            <div className="row" style={{ marginBottom: 8 }}>
              <input
                placeholder="filename"
                value={filename}
                onChange={(e) => setFilename(e.target.value)}
              />
              <button className="btn" onClick={submitReview} disabled={loading}>
                {loading ? "Analizez..." : "Trimite spre analiză"}
              </button>
            </div>

            <textarea
              value={code}
              onChange={(e) => setCode(e.target.value)}
              spellCheck={false}
            />

            {error && (
              <div style={{ color: "crimson", marginTop: 8 }}>{error}</div>
            )}

            {report && (
              <div style={{ marginTop: 12 }}>
                <div style={{ marginBottom: 8 }}>
                  <span className="tag">engine: {report.engine}</span>
                  <span className="tag" style={{ marginLeft: 6 }}>
                    file: {report.filename || filename}
                  </span>
                </div>

                <h4>Findings</h4>
                <Findings list={report.findings} />

                <h4 style={{ marginTop: 16 }}>Sugestii</h4>
                <Suggestions items={report.suggestions} />
              </div>
            )}
          </Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
